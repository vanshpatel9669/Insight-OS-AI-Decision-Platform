name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src scripts tests

      - name: Ruff format check
        run: ruff format --check src scripts tests

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest tests/ -v
        env:
          INSIGHT_MONGO_URI: mongodb://localhost:27017
          INSIGHT_MONGO_DB: insight_os_ci

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t insight-os:ci .

      - name: Start Mongo + app and smoke-test health endpoint
        run: |
          docker network create insight-ci-net
          docker run -d --rm --name insight-mongo-ci --network insight-ci-net mongo:7
          docker run -d --rm --name insight-app-ci --network insight-ci-net -p 8010:8010 \
            -e INSIGHT_MONGO_URI=mongodb://insight-mongo-ci:27017 \
            -e INSIGHT_MONGO_DB=insight_os \
            insight-os:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8010/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8010/health
          docker stop insight-app-ci insight-mongo-ci
