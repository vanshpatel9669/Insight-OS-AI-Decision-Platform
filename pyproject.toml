[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-os"
version = "0.1.0"
description = "Decision-intelligence platform: rule-based triage scoring plus a real embedding-search-and-reranking retrieval service over MongoDB-backed case records, with optional local-LLM RAG context generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymongo>=4.7",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    # Pinned, not floor-bound: sentence-transformers/llama-index/torch/
    # transformers form one interlocking dependency graph where a newer
    # transformers (>=4.45) requires torch>=2.4, which has no macOS x86_64
    # wheels past 2.2.2 — an unpinned resolve breaks differently depending
    # on the install machine. See docs/architecture.md.
    "torch==2.2.2",
    "transformers>=4.40,<5.21",
    # torch==2.2.2 was built against NumPy's 1.x ABI; numpy>=2.0 breaks it
    # at import time ("Numpy is not available") on a completely fresh
    # install (e.g. Docker) that isn't shadowed by an already-installed
    # older numpy left over from a previous local `pip install`.
    "numpy>=1.26,<2",
    "sentence-transformers>=5.0",
    "llama-index-core>=0.14",
    "llama-index-embeddings-huggingface>=0.7",
    "llama-index-storage-docstore-mongodb>=0.3",
    "llama-index-storage-index-store-mongodb>=0.4",
    "llama-index-llms-ollama>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mongomock>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["insight_os"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
